<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task - {{ project_name }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="top-bar">

        <img src="{{ url_for('static', filename='images/logo.svg') }}"
             alt="Study Planner logo"
             class="logo">

        <div>
            <h1>{{ project_name }}</h1>
            <p class="tagline">Edit your task</p>
        </div>

    </header>

    <main class="container">

        <section class="card">

            <h2>Edit task</h2>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST" action="/edit/{{ task.id }}">

                <label for="title">Task title</label>

                <input type="text"
                       id="title"
                       name="title"
                       value="{{ task.title }}">

                <label for="subject">Subject</label>

                <select id="subject" name="subject">

                    {% for subject in subjects %}

                        <option value="{{ subject }}"
                            {% if subject == task.subject %}selected{% endif %}>
                            {{ subject }}
                        </option>

                    {% endfor %}

                </select>

                <label for="due_date">Due date</label>

                <input type="date"
                       id="due_date"
                       name="due_date"
                       value="{{ task.due_date }}">

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="/" class="btn btn-edit">Cancel</a>

            </form>

        </section>

    </main>

    <footer class="footer">
        Built with Python and Flask | Student Study Planner
    </footer>

</body>

</html>
